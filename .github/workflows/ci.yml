name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: npm run lint
        env:
          CI: true

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        env:
          CI: true

      - name: Run Vitest unit + component tests
        run: npm test
        env:
          CI: true

      - name: Run Playwright E2E tests (headless)
        if: always()
        run: npx playwright test
        env:
          CI: true
        timeout-minutes: 30

      - name: Build production site
        run: npm run build
        env:
          CI: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            .next/
            pnpm-debug.log
          retention-days: 7