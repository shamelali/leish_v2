name: Leish v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Minimal env for test suite - SUPABASE_SERVICE_ROLE_KEY skipped for unit tests
      NODE_ENV: test
      # Required for typecheck but won't be set in CI test job
      POSTGRES_URL: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests (vitest, no Supabase deps)
        run: npx vitest run --reporter=verbose 2>&1 | head -100

      - name: Check test suite summary
        run: |
          echo "Test files passed: $(npx vitest run --reporter=verbose 2>&1 | grep -c 'Tests')" || true
