name: CI

# Single quality gate for the repo. Kept intentionally lean so it stays cheap
# on GitHub Free (Actions minutes are metered for private repos): it runs only
# on PRs into main and on direct pushes to main, and cancels superseded runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit is pushed to the same ref, so we
# don't pay for stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # The app uses node:sqlite in CI (no DATABASE_URL); skip prod env checks.
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (coverage thresholds enforced in vitest.config.mts)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
