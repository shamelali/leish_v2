name: Security

# Separate from ci.yml so a security finding never masks (or blocks) the
# correctness gates on a pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published advisories surface without a push.
    - cron: "0 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, otherwise the scan only sees the latest commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos / personal accounts. Add a license secret if
          # this repository ever moves under a paying organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Baseline after the 2026-10-28 remediation: 1 advisory remains, high, and it
    # is a nested zod@4.1.11 under @vercel/cli-config (reached only when
    # @vercel/blob / @vercel/connect resolve an OIDC token; no user input goes
    # through it). The app's own zod is patched. Criticals are blocking so a
    # repeat of next@16.3.1's RCE advisories can never land again; from 43
    # advisories down to 1.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (critical)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit production dependencies (high, advisory)
        # Kept advisory only for the single nested-zod advisory above; raise to
        # blocking once @vercel/cli-config ships a patched zod.
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # JS/TS needs no compilation, so no build step is required here.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
