<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64">
  <defs>
    <linearGradient id="gemMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="gemShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- faceted gem silhouette -->
  <path d="M32 2 L45 13 L47 26 L32 62 L17 26 L19 13 Z" fill="url(#gemMain)"/>
  <!-- crown facets (shine) -->
  <path d="M32 2 L45 13 L47 26 L32 27 Z" fill="url(#gemShine)" opacity="0.35"/>
  <path d="M32 2 L19 13 L17 26 L32 27 Z" fill="url(#gemShine)" opacity="0.16"/>
  <!-- facet lines -->
  <path d="M32 27 L47 26 L45 13 M32 27 L17 26 L19 13 M32 27 L32 62" stroke="#881337" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <!-- sparkles -->
  <circle cx="25" cy="17" r="1.7" fill="#ffffff" opacity="0.9"/>
  <circle cx="39" cy="34" r="1.2" fill="#ffffff" opacity="0.7"/>
  <!-- wordmark -->
  <text x="76" y="45" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Leish<tspan fill="#ffe4e6">!</tspan></text>
</svg>
