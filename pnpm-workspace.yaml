packages: []

# pnpm (v10+) disables dependency build scripts by default. No dependency needs
# a postinstall build to run/build this app; the one transitive package that
# ships a build script (unrs-resolver, via lint tooling) is intentionally
# skipped. strictDepBuilds:false stops pnpm v11 from exiting non-zero with
# ERR_PNPM_IGNORED_BUILDS, which would otherwise break CI / Vercel installs.
strictDepBuilds: false
ignoredBuiltDependencies:
  - unrs-resolver
onlyBuiltDependencies: []
allowBuilds:
  esbuild: set this to true or false
  unrs-resolver: set this to true or false
  workerd: set this to true or false

# Security pins for transitive-only packages that no direct bump can reach.
# Both targets stay inside their parent's declared range:
#   @vercel/blob -> undici ^6.23.0   (6.28.0 -> 6.29.1)
#   next -> postcss -> source-map-js (1.2.1 -> 1.2.2)
# Re-check with `pnpm audit --prod` before removing either.
overrides:
  "undici@<6.29.1": "6.29.1"
  "source-map-js@<1.2.2": "1.2.2"
