# Azure Pipelines — drop-in CI for this repository while GitHub Actions is
# blocked by an account-level billing lock (see docs/CI-WITHOUT-ACTIONS.md).
#
# Why this one: public projects get **unlimited minutes and 10 parallel jobs**
# free on Microsoft-hosted agents, and the Azure Pipelines GitHub app posts real
# commit statuses/checks on pull requests — the property local CI cannot give
# you. Free forever for public repos, no credit card.
#
# Enablement (one-time, ~5 minutes):
#   1. Sign in at https://dev.azure.com with the GitHub account that owns this repo.
#   2. Create an organisation + project (the DevOps project may be private; what
#      matters for the free tier is that the GitHub repository is public).
#   3. Pipelines → Create Pipeline → GitHub → shamelali/leish_v2 →
#      "Existing Azure Pipelines YAML file" → branch `main`,
#      path `/azure-pipelines.yml` → Save.
#   4. Install the Azure Pipelines GitHub app for the repo
#      (GitHub Marketplace → "Azure Pipelines" → Free plan). Without it, no
#      statuses appear on pull requests.
#   5. Repo → Settings → Branches (once runs are green): add the Azure status
#      as a required check on `main`, replacing the `verify`/`integration-pg`
#      entries that can never pass while Actions is locked.
#
# Gate list and environment mirror .github/workflows/ci.yml and
# scripts/ci-local.sh. If you change one, change all three — three divergent
# copies of the gate list is worse than one missing gate.
#
# Notes on Azure-specific choices:
#   - Postgres is started with an explicit `docker run` rather than `services:`,
#     because Azure container resources cannot take `env:` values (the schema
#     only accepts declared resource aliases), and the credentials must match
#     DATABASE_URL. The wait loop replaces Actions' `options: --health-cmd`.
#   - `corepack enable` alone is sufficient: corepack reads the `packageManager`
#     field and fetches pnpm 11.22.0 on first use, exactly as in ci.yml.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  CI: "true"
  SKIP_ENV_VALIDATION: "1"
  PNPM_STORE: $(Pipeline.Workspace)/.pnpm-store

stages:
  - stage: verify
    displayName: Verify (format, lint, typecheck, test, build)
    jobs:
      - job: verify
        displayName: verify
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 20
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: "22.x"

          - script: corepack enable
            displayName: Enable Corepack

          - task: Cache@2
            displayName: Cache pnpm store
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(PNPM_STORE)
              restoreKeys: |
                pnpm | "$(Agent.OS)"

          - script: pnpm config set store-dir $(PNPM_STORE)
            displayName: Point pnpm at the cached store

          - script: pnpm install --frozen-lockfile
            displayName: Install dependencies

          - script: pnpm run format:check
            displayName: Format check

          - script: pnpm run lint
            displayName: Lint

          - script: pnpm run typecheck
            displayName: Typecheck

          - script: pnpm run test:coverage
            displayName: Test (coverage gate 80/80/80/80)

          - script: pnpm run build
            displayName: Build

          - task: PublishPipelineArtifact@1
            displayName: Publish coverage report
            condition: succeededOrFailed()
            inputs:
              targetPath: coverage
              artifact: coverage
              publishLocation: pipeline

  - stage: integration_pg
    displayName: Postgres integration
    dependsOn: verify
    variables:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leish_test
    jobs:
      - job: integration_pg
        displayName: integration-pg
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 15
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail
              docker run -d --name leish-pg \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=postgres \
                -e POSTGRES_DB=leish_test \
                -p 5432:5432 \
                postgres:16-alpine
              for i in $(seq 1 30); do
                if docker exec leish-pg pg_isready -U postgres >/dev/null 2>&1; then
                  echo "postgres ready after ${i}s"
                  exit 0
                fi
                sleep 1
              done
              echo "postgres did not become ready in 30s" >&2
              docker logs leish-pg >&2 || true
              exit 1
            displayName: Start Postgres 16 and wait for readiness

          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: "22.x"

          - script: corepack enable
            displayName: Enable Corepack

          - script: pnpm install --frozen-lockfile
            displayName: Install dependencies

          - script: pnpm vitest run --config vitest.pg.config.mts
            displayName: Run PostgreSQL integration tests
            env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leish_test

  - stage: e2e
    displayName: Playwright e2e
    dependsOn: verify
    jobs:
      - job: e2e
        displayName: e2e
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 20
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: "22.x"

          - script: corepack enable
            displayName: Enable Corepack

          - script: pnpm install --frozen-lockfile
            displayName: Install dependencies

          - script: pnpm run build
            displayName: Build

          - script: pnpm exec playwright install --with-deps chromium
            displayName: Install Playwright browsers

          - script: pnpm run e2e
            displayName: E2E tests

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright report
            condition: succeededOrFailed()
            inputs:
              targetPath: playwright-report
              artifact: playwright-report
              publishLocation: pipeline
